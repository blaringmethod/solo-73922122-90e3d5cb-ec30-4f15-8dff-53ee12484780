# Persistent broker for the fermentation lab.
#
# persistence + autosave mean QoS 1 messages and the archiver's persistent
# session survive broker restarts; listeners on 1883 require no username for
# the local lab network.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
autosave_on_changes true

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type debug

listener 1883
protocol mqtt
allow_anonymous true

max_inflight_messages 0
max_queued_messages 10000
set_tcp_nodelay true
